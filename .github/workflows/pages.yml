name: Publicar web

# Scrapea studbook y publica el sitio en GitHub Pages.
# Corre en cada push a master, cada hora (para levantar resultados y programas
# nuevos) y a mano desde la pestaña Actions.
on:
  push:
    branches: [master]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrapear studbook
        run: python scraper/studbook.py site/data

      # Cambia la URL de app.js/style.css en cada deploy para que el navegador
      # no siga usando la versión cacheada (Pages cachea 10 minutos).
      - name: Versionar assets
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
